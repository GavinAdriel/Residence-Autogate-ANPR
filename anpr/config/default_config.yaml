# Default configuration for the ANPR Autogate System.
#
# This file ships the authoritative schema and default values (design.md,
# Configuration section). Environment variables override any matching key at
# load time (Requirement 14.1): use the ANPR_ prefix with double-underscore
# section separators, e.g. ANPR_CAMERA__TARGET_FPS=30 overrides camera.target_fps.
#
# Switching between the local-test and field environments is config-only; no
# code changes are required (Requirement 14.2).

environment:
  label: local-test           # local-test | field

camera:
  type: webcam                # webcam | ip
  device_index: 0
  stream_url: ""
  target_fps: 30              # 1..60
  reconnect_interval_s: 5     # 1..60
  inactivity_timeout_s: 10    # 1..30
  # Camera.Camera_ID of the row representing this camera. Written to every
  # ANPR_Log record, whose Camera_ID column is NOT NULL with a foreign key to
  # Camera, so this MUST match a seeded row or every event insert is rejected.
  # The Docker init SQL seeds Camera_ID 1 as the default gate camera.
  id: 1

model:
  weights_path: best.pt
  detection_threshold: 0.5    # 0..1

ocr:
  confidence_threshold: 0.70  # 0..1
  timeout_ms: 2000

gate:
  mode: simulation            # simulation | hardware
  hardware_response_timeout_s: 3   # 1..30

storage:
  image_dir: ./images
  capture_enabled: true
  thumbnail_max_px: 320
  retention_days: 30           # 1..365
  retention_interval_h: 24     # 1..24

database:
  host: 127.0.0.1        # localhost only (Req 1.6)
  port: 3306             # matches docker-compose published port
  name: anpr_system      # MYSQL_DATABASE; the schema in docker/mysql/init
  user: anpr             # MYSQL_USER
  password: anprpassword # MYSQL_PASSWORD; overridable via ANPR_DATABASE__PASSWORD

network:
  # Network addresses for field deployment; present in the schema per
  # Requirements 14.2 / 14.4 so environment switching stays config-only.
  gate_host: ""
  gate_port: 0

ui:
  guard:
    min_fps: 10
    max_overlay_latency_ms: 200
    max_update_latency_ms: 500
    max_surfacing_latency_ms: 1000
    manual_plate_max_len: 12
