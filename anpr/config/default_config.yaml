# Default configuration for the ANPR Autogate System.
#
# This file ships the authoritative schema and default values (design.md,
# Configuration section). Environment variables override any matching key at
# load time (Requirement 14.1): use the ANPR_ prefix with double-underscore
# section separators, e.g. ANPR_PIPELINE__TARGET_FPS=30 overrides pipeline.target_fps.
#
# Switching between the local-test and field environments is config-only; no
# code changes are required (Requirement 14.2).

environment:
  label: local-test           # local-test | field

# Cameras. The KEY NAME is the direction: everything seen by `inbound` is an
# entry, everything seen by `outbound` is an exit. List one camera for a
# single-camera gate (fixed direction) or both for a two-camera lane. Remove a
# side you do not use (at least one is required).
#   id           Camera.Camera_ID row to log against. Written to every ANPR_Log
#                record (NOT NULL, foreign key to Camera), so it MUST match a
#                seeded row. The Docker init seeds 1=inbound, 2=outbound.
#   type         webcam | ip
#   device_index webcam index (type: webcam)
#   stream_url   RTSP/HTTP address (type: ip)
cameras:
  inbound:
    id: 1
    type: ip
    device_index: 0
    stream_url: "rtsp://bot_pos3:tes_12345@169.254.50.157:554/cam/realmonitor?channel=3&subtype=1"             # set via ANPR_CAMERAS__INBOUND__STREAM_URL (holds credentials)
  outbound:
    id: 2
    type: ip
    device_index: 1
    stream_url: "rtsp://bot_pos3:tes_12345@169.254.50.157:554/cam/realmonitor?channel=2&subtype=1"             # set via ANPR_CAMERAS__OUTBOUND__STREAM_URL (holds credentials)

model:
  weights_path: best_new.pt
  detection_threshold: 0.5    # 0..1

ocr:
  confidence_threshold: 0.70  # 0..1
  timeout_ms: 2000

pipeline:
  # Settings shared by every camera.
  target_fps: 20              # 1..60
  reconnect_interval_s: 5     # 1..60
  inactivity_timeout_s: 10    # 1..30
  # With two cameras, an outbound read of a plate whose entry was opened within
  # this many seconds is treated as the SAME pass (both cameras glimpsing one
  # entry), not a real exit, so one pass is not double-logged. A genuine later
  # exit correlates normally. 1..30 seconds.
  reconciliation_window_s: 3
  # Per-track deduplication: how many consecutive frames a tracked vehicle may
  # be absent from the detector output before its in-memory state is forgotten.
  # One frame of grace absorbs a momentary single-frame tracker miss without
  # prematurely forgetting a still-present vehicle (0..600).
  track_staleness_frames: 1
  # Extra margin added around each detection box before OCR, as a fraction of
  # the box width/height on each side, so edge characters (e.g. the first
  # letter of a plate) are not clipped. 0 disables padding (0..0.5).
  crop_padding_ratio: 0.10
  # OCR trigger line as a fraction of frame height (0 = top, 1 = bottom). OCR only
  # runs once a vehicle's box centre is at or below this line, so vehicles far
  # up the frame cost no OCR time. 0.5 = bottom half. 0 disables the gate (0..1).
  ocr_min_y_ratio: 0.5

gate:
  mode: simulation            # simulation | hardware
  hardware_response_timeout_s: 3   # 1..30

storage:
  image_dir: ./images
  capture_enabled: true
  thumbnail_max_px: 320
  retention_days: 30           # 1..365
  retention_interval_h: 24     # 1..24

database:
  host: database-anpr.cxosc06ymdoe.ap-southeast-2.rds.amazonaws.com  
  port: 3306             # matches docker-compose published port
  name: anpr_system      # MYSQL_DATABASE; the schema in docker/mysql/init
  user: admin             # MYSQL_USER
  password: anprpassword # MYSQL_PASSWORD; overridable via ANPR_DATABASE__PASSWORD
  # Optional path to a PEM CA-certificate bundle. Empty = no TLS (local Docker).
  # For a remote endpoint (e.g. AWS RDS over the internet) set this to the AWS
  # global CA bundle so the link is encrypted and the server cert is verified.
  # Overridable via ANPR_DATABASE__SSL_CA, e.g. a path to global-bundle.pem.
  ssl_ca: C:\Users\I01621.GAVIN\Documents\Gavin\autogate_project\global-bundle.pem

network:
  # Network addresses for field deployment; present in the schema per
  # Requirements 14.2 / 14.4 so environment switching stays config-only.
  gate_host: ""
  gate_port: 0

ui:
  guard:
    min_fps: 10
    max_overlay_latency_ms: 200
    max_update_latency_ms: 500
    max_surfacing_latency_ms: 1000
    manual_plate_max_len: 12
